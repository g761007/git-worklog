name: Publish to PyPI

# Publishes every GitHub release, built from the release's tag. It can also be
# run by hand from the Actions tab, on the tag to publish. It uses PyPI trusted
# publishing, so there is no token to store: PyPI trusts this workflow for the
# `git-worklog` project (owner g761007, repository git-worklog, workflow
# publish.yml, environment pypi).
on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build the sdist and the wheel
        run: |
          python -m pip install --upgrade build twine
          python -m build
          twine check --strict dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/project/git-worklog/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
