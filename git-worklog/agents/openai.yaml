# Agent / host manifest for the Git Worklog skill.
#
# Subagent provider/model selection is NOT defined here. It lives in a single
# machine-readable source — git_worklog/data/provider_models.json — resolved per
# host by `git-worklog analyze prepare --host <key>`. This keeps one source of
# truth so the YAML, references and engine can never drift to different model
# names. It sits inside the package because only git_worklog* is packaged: from
# outside, an installed CLI could not read it.

name: git-worklog
display_name: Git Worklog
# Deliberately narrow. On Claude Code the skill carries
# `disable-model-invocation: true` and cannot be auto-triggered at all; no host
# manifest field does the same thing, so here the description and the keywords
# below are the only lever, and they are kept to terms that name this tool rather
# than terms that describe ordinary development talk. "Summarize what changed",
# "what did X work on" and "weekly summary" are things a user says a dozen times a
# day without wanting a worklog run.
description: >-
  Maintain a per-day project worklog under .git-worklog/ from actual Git diffs
  and source-code changes, and answer questions from that worklog.
version: 1.1.0

# The skill body is the control layer; this manifest only carries metadata.
entrypoint: SKILL.md
command: /git-worklog

ui:
  category: developer-tools
  icon: 📓
  summary: Per-day project worklog from real Git diffs and code, and reports from it.
  # Only terms that name this tool. Dropped in 1.1.0: "release notes", "git
  # history", "handoff", "weekly summary", "工作摘要", "週報" — each of them
  # matches everyday development conversation, and on a host that can auto-trigger
  # that is how the skill starts running when nobody asked for it.
  keywords:
    - worklog
    - work log
    - git-worklog
    - .git-worklog
    - changelog
    - 工作日誌

# Subagent model selection per host — SINGLE SOURCE OF TRUTH is the JSON below,
# resolved by scripts/resolve_provider_model.py. Defaults prioritise cost
# efficiency for bounded per-day analysis (anthropic: Claude Haiku 4.5, openai:
# GPT-5.6 Luna @ low effort, google: Gemini 3.5 Flash). On an unavailable model
# the skill halts and asks — it never silently swaps to a pricier model,
# auto-picks another, or degrades to commit-message-only. See that file's
# model_unavailable_policy and references/provider-models.md.
model_config: git_worklog/data/provider_models.json

# Presentation shown when the user invokes /git-worklog with no arguments.
#
# Every numbered option here must match the menu in SKILL.md §1 -- same numbers,
# same wording, same order. This copy cannot be a cross-reference (a host reads it
# as data), so tests/test_skill_invocation.py compares the option rows of the two
# and fails on drift; the framing around them is each file's own, which is why the
# check is on the rows rather than the whole block. English on purpose: this is
# interface text, and the worklog's own language follows the conversation
# (SKILL.md §2a), not this file.
default_prompt: |
  Choose what to do:

  [Generate worklog] writes to .git-worklog/ — always previews first
   1. Today
   2. A specific date
   3. Last 7 days
   4. Last 30 days
   5. A custom date range
   6. Today, including uncommitted changes
   7. A custom date or range, including uncommitted changes

  [Report from the existing worklog] read-only — nothing is modified
   8. Work summary for a period
   9. CHANGELOG for a version or tag
  10. What a specific person worked on
  11. Outstanding tech debt and follow-ups

  Limits: generate up to 30 days, report up to 90 days.
  Reply with an option number, or just describe what you want in any language.

capabilities:
  reads_git_history: true
  reads_source_code: true
  writes_files:
    - .git-worklog/index.md
    - .git-worklog/days/<date>.md
  never_runs:
    - git add
    - git commit
    - git push
    - git fetch
    - git pull
    - git checkout
    - git switch
    - git merge
    - git rebase
  # The 30-day cap bounds per-day subagent cost, so it governs worklog
  # generation and gap backfill. Report mode only reads day files already on
  # disk and spawns no subagents, so it reads further — a context bound, not a
  # cost one. See references/report-mode.md.
  max_range_days: 30
  max_report_range_days: 90
  default_include_uncommitted: false
  # Every write previews first and needs explicit confirmation. Report mode
  # writes nothing, so it has no dry-run to confirm.
  always_dry_run_before_write: true
  read_only_report_mode: true
